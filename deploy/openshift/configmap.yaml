apiVersion: v1
kind: ConfigMap
metadata:
  name: safedevops-config
  labels:
    app.kubernetes.io/name: safedevops
data:
  APP_ENV: "production"
  DATA_DIR: "/data"
  FRONTEND_DIST: "/app/frontend/dist"
  SQLITE_JOURNAL_MODE: "DELETE"
  SQLITE_BUSY_TIMEOUT_MS: "5000"
  SQLITE_SYNCHRONOUS_MODE: "FULL"
  OPENAI_ASSESSMENT_MODEL: "gpt-5.6-terra"
  OPENAI_TRANSCRIPTION_MODEL: "gpt-4o-transcribe"
  OPENAI_REASONING_EFFORT: "medium"
  CORS_ORIGINS: "https://safedevops.example.com"
  LOG_LEVEL: "INFO"
  INTEGRATION_LOG_LEVEL: "INFO"
  # Opt in for admin diagnostic panels in production when operators need them.
  ENABLE_ADMIN_INTEGRATION_DIAGNOSTICS: "false"
  INTEGRATION_HTTP_TIMEOUT_SECONDS: "20"
  INTEGRATION_HTTP_CONNECT_TIMEOUT_SECONDS: "5"
  # Optional; leave empty unless the tenant stores acceptance criteria in a custom field.
  JIRA_ACCEPTANCE_CRITERIA_FIELD_ID: ""
