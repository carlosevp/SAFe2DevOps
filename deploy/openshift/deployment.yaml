apiVersion: apps/v1
kind: Deployment
metadata:
  name: safedevops
  labels:
    app.kubernetes.io/name: safedevops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: safedevops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safedevops
    spec:
      # OpenShift assigns an arbitrary UID; do not set runAsUser.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 0
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/safedevops/safedevops:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: safedevops-config
            - secretRef:
                name: safedevops-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 2"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: safedevops-data
        - name: tmp
          emptyDir: {}
