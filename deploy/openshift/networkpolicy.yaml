apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: safedevops
  labels:
    app.kubernetes.io/name: safedevops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: safedevops
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS for OpenAI / Jira / Azure DevOps integrations
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 443
