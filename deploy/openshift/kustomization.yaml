apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - networkpolicy.yaml
# Apply secrets separately from secret.example.yaml (never commit real values).
labels:
  - pairs:
      app.kubernetes.io/name: safedevops
      app.kubernetes.io/part-of: safedevops
    includeSelectors: false
