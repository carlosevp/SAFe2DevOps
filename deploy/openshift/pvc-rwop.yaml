apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: safedevops-data
  labels:
    app.kubernetes.io/name: safedevops
spec:
  accessModes:
    # Prefer exclusive single-pod attachment when the cluster supports it.
    - ReadWriteOncePod
  resources:
    requests:
      storage: 10Gi
  # storageClassName: <cluster-default-or-explicit>
