apiVersion: v1
kind: Secret
metadata:
  name: safedevops-secrets
  labels:
    app.kubernetes.io/name: safedevops
type: Opaque
stringData:
  # Replace every value before applying. Do not commit real secrets.
  APP_SECRET_KEY: "replace-with-long-random-secret"
  DATA_ENCRYPTION_KEY: "replace-with-fernet-compatible-or-long-random-secret"
  ADMIN_PASSWORD_HASH: "replace-with-bcrypt-hash-from-scripts/hash_admin_password.py"
  OPENAI_API_KEY: "replace-me"
  # Optional overrides:
  # DATABASE_URL: "sqlite:////data/db/safedevops.db"
