name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  backend:
    name: Backend lint / typecheck / tests / migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff>=0.9.0" "mypy>=1.14.0" "types-PyYAML>=6.0.0"
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: |
          python -m compileall -q app
          mypy app
      - name: Tests
        env:
          APP_ENV: test
          DATA_DIR: ${{ github.workspace }}/data-ci
        run: pytest -q
      - name: Migration validation
        env:
          APP_ENV: test
          DATA_DIR: ${{ github.workspace }}/data-ci-migrate
          APP_SECRET_KEY: ci-app-secret-key-not-for-production-use
          DATA_ENCRYPTION_KEY: ci-data-encryption-key-not-for-prod
        run: |
          mkdir -p "$DATA_DIR/db"
          alembic upgrade head
          python - <<'PY'
          from pathlib import Path
          import os
          db = Path(os.environ["DATA_DIR"]) / "db" / "safedevops.db"
          assert db.exists(), db
          print("migration ok", db)
          PY
      - name: Bootstrap refusal on bad journal mode
        env:
          APP_ENV: test
          DATA_DIR: ${{ github.workspace }}/data-ci-bad
          SQLITE_JOURNAL_MODE: NOT_A_MODE
          APP_SECRET_KEY: ci-app-secret-key-not-for-production-use
          DATA_ENCRYPTION_KEY: ci-data-encryption-key-not-for-prod
        run: |
          python - <<'PY'
          import sys
          from app.core.bootstrap import main
          raise SystemExit(0 if main([]) == 1 else 1)
          PY

  docker:
    name: Docker build + non-root check
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t safedevops:ci .
      - name: Non-root arbitrary UID can write /data
        run: |
          docker run --rm --user 12345:0 \
            -e APP_ENV=production \
            -e DATA_DIR=/data \
            -e PORT=8000 \
            -e APP_SECRET_KEY='docker-ci-app-secret-key-32bytes!!' \
            -e DATA_ENCRYPTION_KEY='docker-ci-data-encryption-key!!' \
            -e ADMIN_PASSWORD_HASH='$2b$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/X4.G2oQ.Y5zqK8K8K' \
            safedevops:ci \
            python -c "import os; from pathlib import Path; assert os.getuid()==12345; p=Path('/data/db'); p.mkdir(parents=True, exist_ok=True); (p/'probe').write_text('ok'); assert (p/'probe').read_text()=='ok'; print('ok')"
      - name: Entrypoint migrates then serves readiness
        run: |
          cid=$(docker create \
            --user 12345:0 \
            -e APP_ENV=production \
            -e DATA_DIR=/data \
            -e PORT=8000 \
            -e APP_SECRET_KEY='docker-ci-app-secret-key-32bytes!!' \
            -e DATA_ENCRYPTION_KEY='docker-ci-data-encryption-key!!' \
            -e ADMIN_PASSWORD_HASH='$2b$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/X4.G2oQ.Y5zqK8K8K' \
            -e SQLITE_JOURNAL_MODE=DELETE \
            safedevops:ci)
          docker start "$cid"
          for i in $(seq 1 40); do
            if docker exec "$cid" curl -fsS http://127.0.0.1:8000/api/health/ready >/dev/null 2>&1; then
              echo "ready"
              break
            fi
            sleep 2
          done
          docker exec "$cid" curl -fsS http://127.0.0.1:8000/api/health/ready
          docker exec "$cid" test -f /data/db/safedevops.db
          docker kill --signal=SIGTERM "$cid" || true
          # Wait for graceful exit
          for i in $(seq 1 20); do
            if ! docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null | grep -q true; then
              break
            fi
            sleep 1
          done
          docker rm -f "$cid" >/dev/null 2>&1 || true

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Python dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
          pip-audit -r requirements.txt
      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod || true

  sonar:
    name: SonarQube / SonarCloud (optional)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    # Enable with repository variable ENABLE_SONAR=true and SONAR_* secrets.
    if: ${{ vars.ENABLE_SONAR == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ENABLE_SONAR is true but SONAR_TOKEN secret is missing"
            exit 1
          fi
      - name: SonarCloud Scan
        if: ${{ vars.SONAR_ORGANIZATION != '' }}
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'SAFe2DevOps' }}
            -Dsonar.sources=backend/app,frontend/src
            -Dsonar.python.version=3.12
      - name: SonarQube Scan
        if: ${{ vars.SONAR_HOST_URL != '' && vars.SONAR_ORGANIZATION == '' }}
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
